<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phillip's Restart Reading Quest</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#e3f2fd,#90caf9);color:#082b52}.wrap{max-width:720px;margin:auto;padding:24px}a{color:#1565c0}.hero,.card{background:#fff;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #0d47a122}.hero{text-align:center;background:linear-gradient(135deg,#fff,#e3f2fd)}h1{margin:.2em 0;color:#0d47a1}.due{display:inline-block;background:#e65100;color:#fff;padding:7px 13px;border-radius:999px;font-weight:800}.mission{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee}.mission:last-child{border:0}input[type=checkbox]{width:24px;height:24px;accent-color:#1976d2}.prompt{width:100%;min-height:72px;padding:10px;border:2px solid #64b5f6;border-radius:12px;font:inherit}button{background:#0d47a1;color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.saved{color:#2e7d32;font-weight:700;margin-left:8px}small{color:#666}</style></head><body><main class="wrap"><a href="index.html">&larr; Learning Castle</a><section class="hero"><div style="font-size:3rem">&#x23EA; &#x1F9E0; &#x1F4D6;</div><h1>Restart Reading Quest</h1><p><strong><em>Restart</em></strong> by Gordon Korman<br>5th Grade English &middot; Margaret Mubalama</p><span class="due">Needed Wednesday, August 19</span></section><section class="card"><h2>Launch checklist</h2><label class="mission"><input type="checkbox" data-save="book"><span><strong>Book ready</strong><br><small>Put it in your backpack before the due date.</small></span></label><label class="mission"><input type="checkbox" data-save="title"><span><strong>Title theory</strong><br><small>Predict what might be getting a “restart.” No spoilers needed.</small></span></label><label class="mission"><input type="checkbox" data-save="words"><span><strong>Word scout</strong><br><small>Define amnesia, reputation, consequence, and perspective.</small></span></label></section><section class="card"><h2>Your prediction</h2><p>If you could restart one habit, what would you change first?</p><textarea class="prompt" id="note" placeholder="Write your prediction here..."></textarea><p><button id="save">Save on this device</button><span class="saved" id="status"></span></p></section></main><script>
